name: research

on:
  schedule:
    - cron: "41 4 * * 0"   # Sundays
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ${{ secrets.PRIVATE_REPO }}
          token: ${{ secrets.PRIVATE_TOKEN }}
          path: data
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Tools
        run: pip -q install requests
      - name: Run
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: python research_run.py --data data --shard ${{ matrix.shard }} --shards 6 --budget-min 320
      - name: Save to the private repo
        run: |
          cd data
          git config user.name "data-bot"
          git config user.email "data-bot@users.noreply.github.com"
          git add -A state/research output > /dev/null 2>&1 || true
          git commit -q -m "research $(date -u +%F) part ${{ matrix.shard }}" || exit 0
          for i in 1 2 3 4 5 6 7 8; do
            if git pull -q --rebase && git push -q; then exit 0; fi
            sleep $((RANDOM % 30 + 10))
          done
          exit 1
