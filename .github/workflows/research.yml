name: research

on:
  schedule:
    - cron: "41 4 * * 0"   # Sundays
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ${{ secrets.PRIVATE_REPO }}
          token: ${{ secrets.PRIVATE_TOKEN }}
          path: data
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Tools
        run: |
          pip -q install requests
          # CPU-only PyTorch (about 0.2 GB instead of 2+ GB with the GPU libraries) for the AI checks;
          # if this fails the run still works, with the rules only
          pip -q install torch --index-url https://download.pytorch.org/whl/cpu && \
            pip -q install "sentence-transformers>=3.0" "transformers>=4.41" sentencepiece protobuf || \
            echo "AI check libraries not installed: rules only this run"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/sec-notes-models   # AI check + meaning search models (downloaded once, then reused)
          key: ai-models-v1
      - name: Run
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: python research_run.py --data data --shard ${{ matrix.shard }} --shards 6 --budget-min 320
      - name: Save to the private repo
        run: |
          cd data
          git config user.name "data-bot"
          git config user.email "data-bot@users.noreply.github.com"
          for p in state/research state/judge_cache output; do if [ -e "$p" ]; then git add -A "$p"; fi; done
          git commit -q -m "research $(date -u +%F) part ${{ matrix.shard }}" || exit 0
          for i in 1 2 3 4 5 6 7 8; do
            if git pull -q --rebase && git push -q; then exit 0; fi
            sleep $((RANDOM % 30 + 10))
          done
          exit 1

  combine:
    needs: run
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ secrets.PRIVATE_REPO }}
          token: ${{ secrets.PRIVATE_TOKEN }}
          path: data
          fetch-depth: 1
      - name: Join the parts into one report
        run: |
          cd data
          python3 - <<'PY'
          import collections, glob, os, re
          files = sorted(glob.glob("output/research_report_shard*.md"))
          if not files:
              raise SystemExit
          counts, n, mins, title, sections = collections.Counter(), 0, 0, "", []
          for f in files:
              lines = open(f, encoding="utf-8").read().splitlines()
              title = title or re.sub(r" · shard.*", "", lines[0])
              head = True
              for line in lines[1:]:
                  m = re.match(r"(\d+) [a-z ]+ in (\d+) min", line)
                  c = re.match(r"- ([a-z0-9_]+): (\d+)$", line)
                  if head and m:
                      n, mins = n + int(m.group(1)), max(mins, int(m.group(2)))
                  elif head and c:
                      counts[c.group(1)] += int(c.group(2))
                  elif line.startswith("## "):
                      head = False
                  if not head:
                      sections.append(line)
              os.remove(f)
          out = [title + " · all parts", f"{n} companies checked in about {mins} min."]
          out += [f"- {k}: {v}" for k, v in sorted(counts.items())] + [""] + sections
          open("output/research_report.md", "w", encoding="utf-8").write("\n".join(out))
          PY
          git config user.name "data-bot"
          git config user.email "data-bot@users.noreply.github.com"
          git add -A output
          git commit -q -m "one report" || exit 0
          for i in 1 2 3 4 5 6 7 8; do
            if git pull -q --rebase && git push -q; then exit 0; fi
            sleep $((RANDOM % 20 + 5))
          done
          exit 1
